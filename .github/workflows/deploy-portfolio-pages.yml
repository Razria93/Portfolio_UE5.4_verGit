name: Deploy Project Stellar Portfolio

on:
  push:
    branches: [main]
    paths:
      - 'Docs/07_Portfolio_Documents/Portfolio_Production/**'
      - 'Scripts/Publish/Publish-PortfolioDocument.ps1'
      - '.github/workflows/deploy-portfolio-pages.yml'
      - 'portfolio-web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Docs/07_Portfolio_Documents/Portfolio_Production
            Scripts/Publish
            portfolio-web
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preserve previous static portfolio
        shell: pwsh
        run: ./Scripts/Publish/Publish-PortfolioDocument.ps1 -Destination output/portfolio-pages
      - name: Assemble current documents and verified release media
        run: python3 portfolio-web/assemble_site.py --destination output/portfolio-pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/portfolio-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
